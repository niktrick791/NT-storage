# ======================================================
#            NT-storage Configuration
# Universal Support: Minecraft 1.8.8 to 1.21.4+
# ======================================================

# Language setting: "en" for English, "de" for German
# Can also be changed in-game with /lager lang <de|en>
language: "en"

enabled: true

sorting:
  scan-interval-ticks: 10
  max-items-per-cycle: 128

storage:
  load-chunks: false

effects:
  particles: true
  sounds: true
